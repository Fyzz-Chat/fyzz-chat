name: Open source prod pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    if: vars.DISABLE_BUILD != 'true'
    runs-on: ubuntu-latest
    # checks: read and actions: read let the lookup below read this commit's results;
    # contents: read is what checkout needs once a permissions block exists.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      # A commit that already passed this job on a stage push is byte-identical here,
      # so main skips the steps rather than repeating them. The job still succeeds,
      # which keeps every job that needs it running. Any failed lookup runs the tests.
      # Results are read off the commit itself: searching workflow runs by commit came
      # back empty for a stage run 15 hours old, and silently ran the tests again.
      - name: Look for a stage run that already tested this commit
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          echo "Looking for a stage run that tested $GITHUB_SHA (this run: $GITHUB_RUN_ID)"
          if ! checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=test&filter=all&per_page=100" \
            --jq '.check_runs[] | "\(.conclusion) \(.details_url)"'); then
            echo "Could not list this commit's test checks; running the tests"
            checks=""
          fi
          echo "Test checks on this commit: $(printf '%s' "$checks" | grep -c . || true)"
          while read -r conclusion url; do
            [ -z "$url" ] && continue
            run=${url#*/runs/}
            run=${run%%/*}
            if [ "$run" = "$GITHUB_RUN_ID" ]; then
              echo "  run $run: this run, skipped"
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "  run $run: test $conclusion"
              continue
            fi
            if ! origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '"\(.head_branch) \(.event) \(.path)"'); then
              echo "  run $run: could not read the run"
              continue
            fi
            echo "  run $run: test success on $origin"
            if [ "$origin" = "stage push .github/workflows/stage.yml" ]; then
              tested=true
              echo "Stage run $run already tested $GITHUB_SHA"
              break
            fi
          done <<< "$checks"
          echo "tested=$tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.stage.outputs.tested != 'true'
        uses: actions/checkout@v7

      - name: Setup Bun.js
        if: steps.stage.outputs.tested != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: steps.stage.outputs.tested != 'true'
        run: bun install

      - name: Run check
        if: steps.stage.outputs.tested != 'true'
        run: bun run check

      - name: Run type-check
        if: steps.stage.outputs.tested != 'true'
        run: bun run type-check

      - name: Run jscpd
        if: steps.stage.outputs.tested != 'true'
        run: bun run jscpd

      - name: Check unused code
        if: steps.stage.outputs.tested != 'true'
        run: bun run knip

      - name: Run klint
        if: steps.stage.outputs.tested != 'true'
        run: bun run klint

      - name: Run test
        if: steps.stage.outputs.tested != 'true'
        run: bun run test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_commit: ${{ steps.get_commit.outputs.commit }}
      version_tag: ${{ steps.get_commit.outputs.version_tag }}
      has_version_tag: ${{ steps.get_commit.outputs.has_version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install semantic-release globally
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/github @semantic-release/npm @semantic-release/release-notes-generator @semantic-release/git

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Get release commit and version tag
        id: get_commit
        run: |
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Release commit: $RELEASE_COMMIT"

          git fetch --tags
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION_TAG=$(git describe --tags --exact-match HEAD)
            echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=true" >> "$GITHUB_OUTPUT"
            echo "Found version tag: $VERSION_TAG"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=false" >> "$GITHUB_OUTPUT"
            echo "No version tag found"
          fi

  build-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code at release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_commit }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine Docker Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest"
          if [ "${{ needs.release.outputs.has_version_tag }}" = "true" ]; then
            VERSION_TAG="${{ needs.release.outputs.version_tag }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:$VERSION_TAG"
            echo "Adding version tag: $VERSION_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Scoped per branch and per target: a cache shared across them would
          # hand one build another's layers.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:buildcache-latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:buildcache-latest,mode=max

  build-migrate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code at release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_commit }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine Docker Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-latest"
          if [ "${{ needs.release.outputs.has_version_tag }}" = "true" ]; then
            VERSION_TAG="${{ needs.release.outputs.version_tag }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-$VERSION_TAG"
            echo "Adding version tag: migrate-$VERSION_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push migration Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:buildcache-migrate
          cache-to: type=registry,ref=${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:buildcache-migrate,mode=max

  deploy:
    needs: [build-release, build-migrate]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy to Coolify
        if: vars.COOLIFY_WEBHOOK != ''
        run: |
          curl --request POST '${{ vars.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
