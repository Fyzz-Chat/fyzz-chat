name: build

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    if: vars.DISABLE_BUILD != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint, type-check
        run: bun run check && bun run type-check
      
      - name: Check unused code
        run: bun run knip
      
      - name: Run test
        run: bun run test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_commit: ${{ steps.get_commit.outputs.commit }}
      version_tag: ${{ steps.get_commit.outputs.version_tag }}
      has_version_tag: ${{ steps.get_commit.outputs.has_version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install semantic-release globally
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/github @semantic-release/npm @semantic-release/release-notes-generator @semantic-release/git

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Get release commit and version tag
        id: get_commit
        run: |
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Release commit: $RELEASE_COMMIT"

          git fetch --tags
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION_TAG=$(git describe --tags --exact-match HEAD)
            echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=true" >> "$GITHUB_OUTPUT"
            echo "Found version tag: $VERSION_TAG"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=false" >> "$GITHUB_OUTPUT"
            echo "No version tag found"
          fi

  build-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code at release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_commit }}
          fetch-depth: 0

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest"
          if [ "${{ needs.release.outputs.has_version_tag }}" = "true" ]; then
            VERSION_TAG="${{ needs.release.outputs.version_tag }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:$VERSION_TAG"
            echo "Adding version tag: $VERSION_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  build-migrate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code at release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_commit }}
          fetch-depth: 0

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-latest"
          if [ "${{ needs.release.outputs.has_version_tag }}" = "true" ]; then
            VERSION_TAG="${{ needs.release.outputs.version_tag }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-$VERSION_TAG"
            echo "Adding version tag: migrate-$VERSION_TAG"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push migration Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: [build-release, build-migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ vars.COOLIFY_PROD_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Migrate database
        run: |
          bun run db:deploy
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
