name: build

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    if: vars.DISABLE_BUILD != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        env:
          DIRECT_DATABASE_URL: https://dummy:dummy@localhost:5432/dummy

      - name: Lint project
        run: bun run check && bun run type-check

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest

      - name: Install semantic-release globally
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/github @semantic-release/npm @semantic-release/release-notes-generator @semantic-release/git

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Check for Release
        id: check_release
        run: |
          git fetch --tags
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push Docker image
        if: steps.check_release.outputs.released == 'true'
        run: |
          TAG=${{ steps.check_release.outputs.tag }}
          echo "Releasing version $TAG"
          docker tag ${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest ${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:$TAG
          docker push ${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest
          docker push ${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:$TAG

  deploy:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
