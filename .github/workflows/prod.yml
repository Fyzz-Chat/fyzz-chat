name: build

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    if: vars.DISABLE_BUILD != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint project
        run: bun run check && bun run type-check

  release-and-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install semantic-release globally
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/github @semantic-release/npm @semantic-release/release-notes-generator @semantic-release/git

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Determine Docker Tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:latest"
          MIGRATE_TAGS="${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-latest"

          git fetch --tags
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION_TAG=$(git describe --tags --exact-match HEAD)
            TAGS="$TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:$VERSION_TAG"
            MIGRATE_TAGS="$MIGRATE_TAGS,${{ env.REGISTRY }}/fyzz-chat/fyzz-chat:migrate-$VERSION_TAG"
            echo "Found version tag: $VERSION_TAG"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "migrate_tags=$MIGRATE_TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Build and push migration Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.migrate_tags }}

  deploy:
    needs: release-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Migrate database
        run: |
          bun run db:migrate
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
